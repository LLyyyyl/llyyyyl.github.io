{{- $toc := .TableOfContents -}}
{{- if .Params.trainingNote -}}
  {{- $toc = .Fragments.ToHTML 2 3 false -}}
{{- end -}}
{{- if strings.Contains $toc "<li>" -}}
<aside class="toc" aria-label="文章目录">
  {{ partial "breadcrumbs.html" . }}
  <details class="toc-disclosure" open>
    <summary>文章目录</summary>
    <div class="inner">{{ $toc }}</div>
  </details>
</aside>
<script>
  (() => {
    const directory = document.currentScript.previousElementSibling.querySelector('.toc-disclosure');
    const wideScreen = window.matchMedia('(min-width: 1120px)');
    const updateDirectory = () => { directory.open = wideScreen.matches; };
    updateDirectory();
    wideScreen.addEventListener('change', updateDirectory);
  })();
</script>
<script src="{{ "js/toc-progress.js" | relURL }}" defer></script>
{{- end -}}
